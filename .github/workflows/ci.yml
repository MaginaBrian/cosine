name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: API smoke test
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "backend")
          from shop import create_app
          client = create_app().test_client()
          assert client.get("/api/health").status_code == 200
          assert client.get("/api/products").status_code == 200
          missing = client.get("/api/products/does-not-exist")
          assert missing.status_code == 404
          assert client.post("/api/checkout", json={}).status_code == 401
          login = client.post("/api/auth/login", json={
              "email": "studio@cosinemade.com",
              "password": "StudioAdmin!",
          })
          assert login.status_code == 200
          token = login.get_json()["token"]
          orders = client.get("/api/orders", headers={"Authorization": f"Bearer {token}"})
          assert orders.status_code == 200
          PY

  # Single gate for branch protection and for the Deploy workflow.
  ci:
    name: CI
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require frontend and backend
        run: |
          frontend="${{ needs.frontend.result }}"
          backend="${{ needs.backend.result }}"
          echo "frontend=$frontend backend=$backend"
          test "$frontend" = success -a "$backend" = success
