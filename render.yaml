# Render Blueprint. Connect this repo in the dashboard (New → Blueprint).
# Auto-deploy is off so GitHub Actions owns CD: after CI passes on main,
# .github/workflows/deploy.yml POSTs each service's Deploy Hook.
services:
  - type: web
    name: cosine-made-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: studio@cosinemade.com
      - key: ADMIN_PASSWORD
        value: "StudioAdmin!"
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: cosine-made
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: cosine-made
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        fromService:
          type: web
          name: cosine-made-api
          envVarKey: RENDER_EXTERNAL_URL
